services:
  # Backend Service (FastAPI)
  backend:
    build: ./backend
    container_name: assessment_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/assessment_db
    depends_on:
      db:
        condition: service_healthy

  # Database Service (PostgreSQL)
  db:
    image: postgres:17-alpine
    container_name: assessment_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assessment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assessment_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: